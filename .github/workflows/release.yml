name: Release

# L4 人工冻结边界：发布只能由人手动触发，workflow 负责可复现执行。
# 保护兼容：不再直接 push 未测试的 merge SHA 到 master。
# 流程：release 分支 → 合并 master → dispatch CI 跑满 12 项检查 → PR → 合并 → tag/Release/GHCR。
# dry_run 默认 true，只验证分支、CI、PR 创建，最后关闭 PR 并删除分支，不发版。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 输入 release 确认发布（其余值直接失败）
        required: true
        type: string
      deploy:
        description: 发布成功后是否部署到生产
        required: false
        default: false
        type: boolean
      dry_run:
        description: 只验证发布链路，不合并 master、不打 tag、不推 GHCR、不建 Release
        required: false
        default: true
        type: boolean

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write
  pull-requests: write

jobs:
  release:
    name: Release (release branch + PR + tag + GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/integrate'
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.merge.outputs.merge_sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONFIRM: ${{ inputs.confirm }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Guard confirmation token
        run: |
          if [ "$CONFIRM" != "release" ]; then
            echo "confirm 必须为 release，实际为: $CONFIRM"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN：只验证发布链路，不产生 master/tag/Release/GHCR 副作用"
          else
            echo "REAL RELEASE：将合并 PR、打 tag、发布 Release 与 GHCR"
          fi

      - uses: actions/checkout@v5
        with:
          ref: integrate
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Enable pnpm (corepack)
        run: npm install -g corepack && corepack enable

      - name: Resolve pnpm version
        run: pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm install --frozen-lockfile

      - name: Compute release tag
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          TAG="v$(date -u +%Y.%m.%d)-${SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Assert CI is green for this exact SHA
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            gh run list --workflow ci.yml --branch integrate --limit 50 \
              --json databaseId,headSha,status,conclusion,event > runs.json
            if OUT=$(node -e '
              const fs = require("node:fs");
              const runs = JSON.parse(fs.readFileSync("runs.json", "utf8"));
              const sha = process.env.SHA;
              const run = runs.find((item) => item.headSha === sha);
              if (!run) { console.error("CI run 尚未出现"); process.exit(2); }
              if (run.status !== "completed") {
                console.error(`CI ${run.databaseId} 仍在 ${run.status}`);
                process.exit(3);
              }
              if (run.conclusion !== "success") {
                console.error(`CI ${run.databaseId} 结论为 ${run.conclusion}`);
                process.exit(1);
              }
              console.log(`${run.databaseId} ${run.event}`);
            '); then
              echo "CI run: $OUT"
              exit 0
            else
              CODE=$?
              if [ "$CODE" -eq 2 ] || [ "$CODE" -eq 3 ]; then
                echo "等待 CI（第 ${i}/60 次，15s 后重试）"
                sleep 15
              else
                exit 1
              fi
            fi
          done
          echo "等待 CI 超时（15 分钟）"
          exit 1
        env:
          SHA: ${{ github.sha }}

      - name: Prepare release branch
        id: prepare
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          BRANCH="release/${TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "aa386400024"
          git config user.email "41391477@qq.com"
          git fetch origin master integrate --tags
          git checkout -B "$BRANCH" "$SOURCE"
          if ! git merge-base --is-ancestor origin/master HEAD; then
            git merge --no-ff origin/master -m "chore(release): merge master into $TAG"
          else
            echo "master 已是祖先，无需合并"
          fi
          git merge-base --is-ancestor origin/master HEAD
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release branch: $BRANCH"
          echo "release sha: $RELEASE_SHA"

      - name: Push release branch
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: git push origin "$BRANCH"

      - name: Dispatch CI for release commit
        id: ci
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --limit 20 \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | .databaseId" | head -n1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            echo "等待 dispatch CI 出现（第 ${i}/60 次）"
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "dispatch CI 未出现"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          gh run watch "$RUN_ID" --exit-status
          RUN_SHA=$(gh run view "$RUN_ID" --json headSha --jq .headSha)
          if [ "$RUN_SHA" != "$RELEASE_SHA" ]; then
            echo "CI headSha $RUN_SHA 与 release SHA $RELEASE_SHA 不一致"
            exit 1
          fi
          gh run view "$RUN_ID" --json headSha,status,conclusion

      - name: Set up Docker Buildx
        if: inputs.dry_run == false
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        if: inputs.dry_run == false
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          LATEST="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Create release PR
        id: pr
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE: ${{ steps.meta.outputs.sha }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          BODY=$(printf 'Release %s\n\nSource SHA: %s\nRelease SHA: %s\nCI run: https://github.com/%s/actions/runs/%s\nDry run: %s' \
            "$TAG" "$SOURCE" "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$CI_RUN_ID" "$DRY_RUN")
          gh pr create --base master --head "$BRANCH" --title "chore(release): $TAG" --body "$BODY"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "PR 创建后未找到"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER: https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"

      - name: Dry-run summary
        if: inputs.dry_run == true
        run: |
          echo "dry-run 验证通过：release 分支、12 项 CI、PR 创建均成功；未合并 master、未打 tag、未推 GHCR、未建 Release。"

      - name: Cleanup dry-run artifacts
        if: always() && inputs.dry_run == true
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set +e
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr close "$PR_NUMBER" --delete-branch
          fi
          git push origin --delete "$BRANCH"
          exit 0

      - name: Merge release PR
        id: merge
        if: inputs.dry_run == false
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq .mergeStateStatus)
            echo "merge state: $STATE（第 ${i}/24 次）"
            if [ "$STATE" = "CLEAN" ] || [ "$STATE" = "HAS_HOOKS" ]; then
              break
            fi
            if [ "$STATE" = "DIRTY" ]; then
              echo "PR 存在冲突，终止发布"
              exit 1
            fi
            sleep 5
          done
          gh pr merge "$PR_NUMBER" --merge
          git fetch origin master
          MERGE_SHA=$(git rev-parse origin/master)
          git merge-base --is-ancestor "$RELEASE_SHA" "$MERGE_SHA"
          git diff --quiet "$RELEASE_SHA" "$MERGE_SHA"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "merged master: $MERGE_SHA"

      - name: Create and push release tag
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING=$(git rev-list -n1 "$TAG")
            if [ "$EXISTING" != "$MERGE_SHA" ]; then
              echo "tag $TAG 已指向 $EXISTING，与本次 master 发布提交 $MERGE_SHA 不一致"
              exit 1
            fi
            echo "tag $TAG 已存在且指向同一发布提交，跳过创建"
          else
            git tag -a "$TAG" "$MERGE_SHA" -m "Release $TAG ($MERGE_SHA)"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过"
          else
            gh release create "$TAG" --target "$MERGE_SHA" --title "$TAG" --generate-notes
          fi

      - name: Delete release branch
        if: inputs.dry_run == false
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set +e
          git push origin --delete "$BRANCH"
          exit 0

  deploy:
    name: Deploy production (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: inputs.deploy == true && needs.release.result == 'success' && inputs.dry_run == false
    environment: production
    env:
      DEPLOY_VERSION: ${{ needs.release.outputs.tag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Enable pnpm (corepack)
        run: npm install -g corepack && corepack enable

      - name: Resolve pnpm version
        run: pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm install --frozen-lockfile

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${DEPLOY_HOST#*@}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Build production artifact
        run: pnpm build

      - name: Deploy (server-side docker build + health gate)
        run: printf 'yes-deploy\n' | pnpm deploy:tested
