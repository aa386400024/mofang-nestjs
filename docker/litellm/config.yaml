# V2026-09-04 LiteLLM 配置 — 心塑 V6.0 §3.5 LLM 反向代理 (可选).
#
# 用法:
#   docker compose --profile litellm up -d litellm
#   api 容器 .env: LLM_BASE_URL=http://litellm:4000
#
# 跟直接调厂商 API 的取舍:
#   - LiteLLM 优点: 多厂商统一 quota, 一站管理; 限流 + 重试; 模型 fallback.
#   - LiteLLM 缺点: 多一跳网络, dev 阶段反而慢; 镜像 ~ 200 MB.
#   - V2.0 推荐直接调厂商; V3 接 LiteLLM 做 quota + 审计.

model_list:
  # ----- OpenAI -----
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      dimensions: 1536

  # ----- DeepSeek (国内, 性价比) -----
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com/v1

  # ----- 豆包 (火山引擎) -----
  - model_name: doubao-pro-32k
    litellm_params:
      model: openai/doubao-pro-32k
      api_key: os.environ/DOUBAO_API_KEY
      api_base: https://ark.cn-beijing.volces.com/api/v3

  # ----- 通义千问 (阿里云 dashscope) -----
  - model_name: qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_key: os.environ/QWEN_API_KEY
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1

# 通用参数
litellm_settings:
  # 失败重试 (OpenAI/DeepSeek/Anthropic 等都支持)
  num_retries: 3
  # 限流 — 60 req/min 软限
  rpm: 60
  # 调试日志
  set_verbose: false
  # Master key (admin 接口鉴权)
  master_key: os.environ/LITELLM_MASTER_KEY

# 路由策略 — 默认 fallback
router_settings:
  num_retries: 3
  timeout: 30
  # enable_pre_call_checks: true  # 调用前检查模型可用性
