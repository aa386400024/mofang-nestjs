# Prometheus scrape 配置 (mofang-nestjs)
# https://prometheus.io/docs/prometheus/latest/configuration/

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mofang-prod'
    monitor: 'mofang-prometheus'

# 告警规则
rule_files:
  - 'alerts.yml'

# Alertmanager (可选, V3 接)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # ============================================================
  # mofang-nestjs API
  # ============================================================
  - job_name: 'mofang-nestjs'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'mofang-api'
          env: '${NODE_ENV:-production}'

  # ============================================================
  # Prometheus 自身
  # ============================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ============================================================
  # Redis exporter (可选)
  # ============================================================
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # ============================================================
  # MySQL exporter (可选)
  # ============================================================
  # - job_name: 'mysql'
  #   static_configs:
  #     - targets: ['mysqld-exporter:9104']