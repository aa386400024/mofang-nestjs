# Prometheus alert rules (mofang-nestjs)
#
# ⚠️ **V2026-11-05 治本 (WP45 · P3-6)**: 本文件原来混着三类规则, 其中一类**永远不会触发**:
#   ① 引用 node_exporter / redis_exporter 的指标 (`node_memory_*` / `node_cpu_seconds_total` /
#      `up{job="redis-exporter"}`) —— 但 `prometheus.yml` 里这两个 exporter 的 scrape job
#      **都是注释掉的** (标记为"可选"), 指标根本不存在 → 表达式恒为空向量 → 永不触发.
#      后端**补不了**这些指标 (它们不是本服务的指标) —— 要启用得先在 compose 里加 exporter.
#      按任务单"没有的话, 要么补指标, 要么删掉没用的告警规则" → **本单删掉这 3 条**,
#      并在下面留了"想启用时怎么加回来"的说明.
#   ② 模板语法写错的: `{{ ${ $value } }}` —— Prometheus 的模板语法是 `{{ $value }}`,
#      `${ $value }` 不是合法写法, 渲染不出值 (告警能发出去, 但描述里是空的).
#   ③ 拿 `rate()` (每秒速率) 去比一个"次数"阈值: `sum(rate(counter[5m])) > 10`
#      的真实含义是"每秒超过 10 次", 不是"5 分钟内 10 次" —— 描述与口径对不上.
#      本单统一改成 `increase()` (窗口内增量, 单位=次), 与描述一致.
#
# 📌 **本文件只放"后端自己暴露的指标"的规则**:
#   后端指标清单见 `src/shared/infra/metrics/metrics.service.ts` (MetricsService).
#   新增告警前先确认: ① 指标真的在那个文件里注册了; ② 它在 `metrics.enabled`
#   打开时会被真的 inc (注册了但没人调 = 恒 0).
#
# 节点 / Redis / MySQL 这类**基础设施**指标的告警, 要等对应 exporter 的 scrape job
# 在 `prometheus.yml` 里启用后再加回本文件 (那属于"加可观测组件", 不属于清技术债).

groups:
  # ============================================================
  # HTTP / 性能
  # ============================================================
  - name: http-performance
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{code=~"5.."}[5m])) by (route)
            / sum(rate(http_requests_total[5m])) by (route)
            > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "5xx 错误率过高 ({{ $labels.route }})"
          description: "{{ $labels.route }} 5xx 错误率 {{ $value | humanizePercentage }} (>5%, 持续 5 分钟)"

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (route, le))
            > 1.0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P99 延迟过高 ({{ $labels.route }})"
          description: "P99 延迟 {{ $value }}s (>1s, 持续 5 分钟)"

      - alert: SlowRequestCount
        # ⚠️ 口径修正 (WP45): 原式是 `sum(rate(bucket{le="+Inf"})) > 0 and sum(rate(_count)) > 100`
        #   —— 前半段恒真 (只要有流量就 > 0), 整个 `and` 等价于后半段, 但**速率**比"次数"阈值,
        #   描述写的却是"请求数". 改成 `increase()` (窗口内增量, 单位=次), 与描述一致.
        expr: |
          sum(increase(http_request_duration_seconds_count[5m])) by (route) > 100
        for: 10m
        labels:
          severity: info
          team: backend
        annotations:
          summary: "路由流量监控 ({{ $labels.route }})"
          description: "5 分钟内 {{ $value }} 次请求, 持续监控中, 关注突增"

  # ============================================================
  # Auth / 鉴权
  # ============================================================
  - name: auth-security
    interval: 30s
    rules:
      - alert: HighFailedLoginRate
        # ⚠️ 口径修正 (WP45): `rate()` → `increase()` —— 比的是"5 分钟内失败多少次",
        #   不是"每秒失败多少次".
        expr: |
          sum(increase(auth_login_attempts_total{result="failed"}[5m]))
            > 10
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "登录失败率异常"
          description: "5 分钟内 {{ $value }} 次登录失败 (可能是撞库攻击)"

      - alert: AccountLockedSpike
        # ⚠️ 口径修正 (WP45): 同上, `rate()` → `increase()` (窗口内锁定次数).
        expr: |
          sum(increase(auth_login_attempts_total{result="locked"}[5m]))
            > 1
        for: 1m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "账号锁定激增"
          description: "5 分钟内有 {{ $value }} 个账号被锁定"

  # ============================================================
  # Visitor Render / 来访者渲染链路 (AF-283)
  # ============================================================
  #
  # 口径前提 (AF-292 修正):
  #   ① 降级率/回退率的分母是 visitor_render_rounds_total (每个终局轮次恰好 +1),
  #      不再是候选尝试次数; 全员冷却/guard 提前返回也进分母.
  #   ② barge-in / 暂停记 rounds{cancelled} 与 cancelled_total, 不是降级;
  #      它进统一分母, 但不进降级分子.
  #   ③ degraded_total{cause=guard} 不计入降级率: 守卫命中的正确拦截不指向 provider,
  #      另有 rounds{guard} 单列.
  #   ④ 候选级真实失败原因在 failure_total{candidate,model,cause}.
  #
  # 阈值依据: AF-268/AF-277/AF-278 实测 TTFT 0.5–1.3s, 回滚态 0.6–5.0s; 灰度初期
  #   生产样本不足, 阈值宁可先宽后紧, Runbook 里标注了调整入口.
  - name: visitor-render
    interval: 30s
    rules:
      - alert: VisitorRenderDegradedRateHigh
        # provider 健康度口径: 分母排除 cancelled 与 guard (AF-298).
        # barge-in 是正常交互, 若进分母会随业务形态稀释 provider 信号:
        # 25% barge-in 时 4% 真实降级会被读成 3.0%, 恰好卡在 >3% 阈值下面.
        # 体验失败率是另一条曲线 (分子含 guard, 分母仅排除 cancelled), 见看板 id 10.
        # 分子排除 cause=guard: 守卫命中是正确拦截, 不指向 provider.
        expr: |
          sum(increase(visitor_render_degraded_total{cause!="guard"}[10m]))
            /
          clamp_min(
            sum(increase(visitor_render_rounds_total{outcome=~"success|degrade|exhausted"}[10m])),
            0.001
          )
            > 0.03
        for: 10m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染降级率过高"
          description: "10 分钟 provider 降级率 {{ $value | humanizePercentage }} (>3%, 分母已排除 cancelled 与 guard); 查看 visitor_render_degraded_total 的 cause 与 failure_total"

      - alert: VisitorRenderRoundInvariantMismatch
        # AF-298 / AF-292 A4: 恒等式守卫.
        # 每个降级轮次恰好调一次 onDegraded ⇒ degraded_total 的增量应等于
        # rounds{outcome=degrade|guard|exhausted} 的增量. 分子比轮次多 ⇒
        # 某条路径重复记了降级; 分子有值而轮次为 0 ⇒ 漏记 rounds 分母.
        # 用 unless 而不是 !=: 两侧都无样本时不应制造告警.
        expr: |
          sum(increase(visitor_render_degraded_total[10m]))
            unless
          sum(increase(visitor_render_rounds_total{outcome=~"degrade|guard|exhausted"}[10m]))
        for: 10m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染轮次恒等式不自洽"
          description: "10 分钟内 degraded_total 增量与 rounds{degrade|guard|exhausted} 增量不一致; 检查 onRoundOutcome/onDegraded 是否重复或漏记, 先看看板 id 18 的 outcome 分布"

      - alert: VisitorRenderAuthFailure
        # 鉴权失败没有"可接受频率": 任何一次都说明密钥/配额/账号配置坏了.
        # 必须 by (candidate): 否则大括号会丢掉标签, annotation 的 $labels.candidate 永远为空.
        expr: |
          sum(increase(visitor_render_auth_failure_total[5m])) by (candidate) > 0
        for: 1m
        labels:
          severity: critical
          team: ai-engine
        annotations:
          summary: "来访者渲染候选鉴权失败 ({{ $labels.candidate }})"
          description: "5 分钟内发生 {{ $value }} 次 401/403, 当前候选已不可用; 立即检查 provider key 与配额"

      - alert: VisitorRenderFirstDeltaSlow
        # first-delta 是 raw chunk 首包预算, 不是 TTFT; P95 用直方图分位, 不做平均.
        expr: |
          histogram_quantile(0.95,
            sum(rate(visitor_render_first_delta_seconds_bucket[10m])) by (le, candidate)
          )
            > 2
        for: 10m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染首包 P95 过慢 ({{ $labels.candidate }})"
          description: "首包 P95 {{ $value }}s (>2s, 10 分钟); 检查上游延迟、模型档位与网络"

      - alert: VisitorRenderStreamTimeoutSpike
        # 10m 判强度, 1m 判是否仍在发生: 只靠 10m 窗口, 故障停止后还会被旧样本拖着 firing.
        expr: |
          sum(increase(visitor_render_stream_timeout_total[10m])) by (phase) > 5
            and
          sum(increase(visitor_render_stream_timeout_total[1m])) by (phase) > 0
        for: 5m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染流式超时激增 ({{ $labels.phase }})"
          description: "10 分钟内 {{ $labels.phase }} 超时 {{ $value }} 次 (>5); 首包超时看上游冷启动, idle 看上游断流"

      - alert: VisitorRenderFallbackRateHigh
        # 与 provider 降级率同分母: success|degrade|exhausted, 排除 cancelled 与 guard.
        # 分子是主备切换尝试, 一轮最多一次; 用 attempts 做分母会让重试越多分母越大.
        expr: |
          sum(increase(visitor_render_fallback_total[10m]))
            /
          clamp_min(
            sum(increase(visitor_render_rounds_total{outcome=~"success|degrade|exhausted"}[10m])),
            0.001
          )
            > 0.10
        for: 10m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染候选回退率过高"
          description: "10 分钟回退率 {{ $value | humanizePercentage }} (>10%); 查看 failure_total 的 cause 分布"

      - alert: VisitorRenderFailureCauseSpike
        # 按 cause 分面: rate-limit / server / network / timeout / auth / guard 才能分开判读.
        # 加 1m 持续条件: 某 cause 刚停 1m 后不再 firing, 避免把已结束故障当成仍在发生.
        expr: |
          sum(increase(visitor_render_failure_total[10m])) by (cause) > 10
            and
          sum(increase(visitor_render_failure_total[1m])) by (cause) > 0
        for: 5m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染候选失败激增 (cause={{ $labels.cause }})"
          description: "10 分钟内 cause={{ $labels.cause }} 失败 {{ $value }} 次 (>10); 对照 Runbook 的 cause→处置表"

      - alert: VisitorRenderCooldownServedSpike
        # 全损是"整轮无候选可用", 与候选试完败分开计数; 有备候选或半开探测可用时不记.
        # 1m 条件: 全损停止后不再因为 10m 窗口里还有旧样本继续 firing.
        expr: |
          sum(increase(visitor_render_cooldown_served_total[10m])) > 3
            and
          sum(increase(visitor_render_cooldown_served_total[1m])) > 0
        for: 5m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染熔断全损激增"
          description: "10 分钟内 {{ $value }} 轮因全员冷却无候选可用 (>3); 先看 candidate_cooldown_seconds 的归因与时长, 再决定是否人工回滚"

      - alert: VisitorRenderCandidateCooldownSpike
        # 候选级归因: 哪个候选被熔、因为什么; 频率异常时先看单候选是否在反复进退冷却.
        # 1m 条件: 该 candidate+cause 最近一分钟不再进冷却, 就不再算"正在激增".
        expr: |
          sum(increase(visitor_render_candidate_cooldown_seconds_count[10m])) by (candidate, cause) > 5
            and
          sum(increase(visitor_render_candidate_cooldown_seconds_count[1m])) by (candidate, cause) > 0
        for: 5m
        labels:
          severity: warning
          team: ai-engine
        annotations:
          summary: "来访者渲染候选熔断激增 (candidate={{ $labels.candidate }}, cause={{ $labels.cause }})"
          description: "10 分钟内候选 {{ $labels.candidate }} 因 cause={{ $labels.cause }} 进入冷却 {{ $value }} 次 (>5); 对照 candidate_cooldown_seconds 的 P95 时长与 failure_total 判读"

  # ============================================================
  # Audit / 审计
  # ============================================================
  - name: audit-integrity
    interval: 30s
    rules:
      - alert: AuditLogProcessingFailure
        expr: |
          sum(increase(audit_log_failed_total[5m]))
            > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "审计日志写入失败"
          description: "5 分钟内失败 {{ $value }} 次, 异步队列可能有问题"
