# V2026-11-25 Qdrant 1.12 服务端配置 — 心塑 V6.0 §12 RAG 知识库.
#
# 用法:
#   docker compose --profile rag up -d qdrant
#   容器启动时会读这个文件 (跟 docker-compose.yml command --config-path 配对).
#
# 注意:
#   - 1.12 不接受 storage.wal: true (wal 必须是对象), 这里保留空对象走默认.
#   - API key 不写死在这里, 统一由 compose 的 QDRANT__SERVICE__API_KEY 注入.

service:
  # API key 鉴权只走环境变量, 配置文件不写 ${...} (Qdrant 不做 shell 展开)
  # CORS — 关闭 (只有服务端连)
  enable_cors: false

  # gRPC 端口 (跟 docker-compose 端口映射 6334 一致)
  grpc_port: 6334

storage:
  # 单 collection 向量存储路径 (默认 /qdrant/storage/collections)
  storage_path: /qdrant/storage
  # WAL — 1.12 要求对象类型, 空对象 = 使用默认 WAL 配置
  wal: {}
  # 快照策略 — 每 1000 段写触发
  snapshots_path: /qdrant/snapshots

# 优化器 — 默认参数即可, 大规模 (>1M 向量) 调优见 https://qdrant.tech/documentation/guides/configuration/
optimizers:
  default_segment_number: 0
  memmap_threshold_kb: 50000

# Telemetry — 关掉 (隐私合规)
telemetry_disabled: true

# 日志
log_level: INFO
