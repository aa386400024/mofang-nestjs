# ============================================================
# mofang-nestjs nginx 反代配置片段
#
# 用法 (服务器 nginx.conf):
#   # /etc/nginx/nginx.conf 的 http {} 块里, 加 include:
#   include /opt/mofang-nestjs/nginx/mofang-nestjs.conf;
#
# 也可作为 server {} 块直接复制粘贴
#
# 适用:
#   - 心塑 (xin_su_app) → mofang-nestjs
#   - 魔方 (mofang) → mofang-nestjs
#   共用同一个后端, 通过同一个反代入口
# ============================================================

# ---------- upstream ----------
upstream mofang-nestjs-api {
    # docker compose 用 host 网络, 容器直接绑 host 3001
    server 127.0.0.1:3001;

    # 备用: 如果以后改回 bridge 网络, 改成:
    # server mofang-nestjs-api:3001;
    # 或者用 container IP (host 网络下用不到)

    keepalive 32;  # 减少 upstream 连接握手
}

# ---------- server block ----------
server {
    listen 3001 ssl;
    server_name api.mofang.cloud;  # TODO: 申请 mofang.cloud 子域名证书后改这里

    # SSL 证书 (跟 mystudy.cloud 共用 Let's Encrypt / TrustAsia)
    ssl_certificate     /etc/nginx/ssl/mystudy.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mystudy.cloud/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ---------- 日志 ----------
    access_log /var/log/nginx/mofang-nestjs-access.log;
    error_log  /var/log/nginx/mofang-nestjs-error.log warn;

    # ---------- 限流 (DDoS 防护, 应用层 Throttler 已有, nginx 层加一道) ----------
    limit_req_zone $binary_remote_addr zone=mofang_api:10m rate=60r/m;
    limit_req_status 429;

    # ---------- client_max_body_size (视频上传场景) ----------
    client_max_body_size 100M;

    # ---------- 反代 ----------
    location /api/ {
        limit_req zone=mofang_api burst=20 nodelay;

        proxy_pass http://mofang-nestjs-api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # timeout (长连接 / 大文件上传)
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不要缓存 API 响应
        proxy_buffering off;
        proxy_cache off;
    }

    # 根路径 (健康检查 + metrics)
    location = /health {
        proxy_pass http://mofang-nestjs-api;
        access_log off;  # 健康检查不打日志
    }

    location = /metrics {
        # metrics 内部网络访问, 外网屏蔽
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://mofang-nestjs-api;
    }

    # Prometheus scrape 配置 (如果以后加)
    # /api/metrics 已经在上面 location /api/ 覆盖
}

# ============================================================
# 直接 IP 访问 3001 (没用 ssl_certificate 时 fallback)
# 用于内网调试 (开发期间 curl 127.0.0.1:3001)
# ============================================================
server {
    listen 3001;
    server_name _;

    # 只允许内网 + 本机
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    deny all;

    location / {
        proxy_pass http://mofang-nestjs-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}